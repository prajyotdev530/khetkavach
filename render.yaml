# Render blueprint: the KhetKavach backend as a free Docker web service (Dashboard → New → Blueprint → this repo).
services:
  - type: web
    name: khetkavach-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEMO_CONTROLS
        value: "true"
