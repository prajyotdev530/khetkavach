# CI on every push: backend unit tests (live API tests are run by hand before deploy: pytest -m live)
# and a production build of the frontend.
name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pytest==9.2.0 pytest-asyncio==1.4.1
      - run: pytest -q -m "not live" --deselect tests/test_api.py::test_rejected_location_stops_before_any_data_call
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run build
