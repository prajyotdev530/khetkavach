# KhetKavach risk thresholds, weights and crop stage tables.
#
# Every value here is a DEFAULT taken from the KhetKavach build spec (BUILD_SPEC.md §7) and must be reviewed
# by an agronomist before operational use. Nothing in this file is measured data; it is the scoring rulebook.
# The risk engine (app/engine/risk.py) reads ONLY this file for numbers, so judges can see nothing is hidden.
#
# lin(x, a, b) maps x to 0-100: 0 at the "no concern" point a, 100 at the "full concern" point b.

levels:
  low_max: 33        # 0-33 = Low      (BUILD_SPEC §7 "Levels")
  moderate_max: 66   # 34-66 = Moderate, 67-100 = High

# A hazard needs at least this share of its total weight backed by evidence, else "Not enough data".
min_weight_fraction: 0.5

# India Meteorological Department counts a day with >= 2.5 mm as a "rainy day"; drier days extend a dry run.
rainy_day_mm: 2.5

drought:
  components:
    D1: {a: 10, b: 60, weight: 0.30}     # water deficit (ET0 - rain, next 16 days), mm
    D2: {a: 5, b: 14, weight: 0.15}      # longest run of days < 2.5 mm rain in the next 16 days
    D3: {a: 0.0, b: 0.18, weight: 0.20}  # 0.30 - root-zone soil moisture (m3/m3); 0.30 is the "comfortable" level
    D4: {a: 0.02, b: 0.15, weight: 0.20} # -delta NDMI (crop moisture drop vs same weeks last year)
    D4_radar: {a: 0.5, b: 3.0, weight: 0.20}  # -delta VH backscatter (dB) when radar replaces optical
    D5: {a: 20, b: 80, weight: 0.15}     # -(past 30 days rain anomaly %), i.e. how far below normal
  soil_comfort_m3m3: 0.30
  # D2 rule: when the 20-year normal rain for the next 16 days is under this, dry weeks are normal for the
  # season, so D2 is set to 0 and its weight is moved to D1.
  d2_min_normal_rain_mm: 10
  sensitive_multiplier: 1.15
  sensitive_stages:
    wheat: [crown_root_initiation, heading_flowering]
    mustard: [flowering]

excess_rain:
  components:
    E1: {a: 20, b: 80, weight: 0.45}     # highest rolling 3-day rain total in the next 16 days, mm
    E2: {a: 10, b: 60, weight: 0.25}     # next-16-day rain minus its 20-year normal, mm
    E3: {a: 40, b: 90, weight: 0.15}     # highest daily rain probability in the next 7 days, %
    E4: {a: 0.35, b: 0.45, weight: 0.15} # root-zone soil moisture (waterlogging), m3/m3
  sensitive_multiplier: 1.3
  sensitive_stages:
    wheat: [heading_flowering, maturity_harvest]
    mustard: [flowering, maturity_harvest]
    gram: [flowering, maturity_harvest]

heat:
  components:
    H1: {a: 0, b: 6, weight: 0.50}       # days in the next 16 with max temperature >= the stage threshold
    H2: {a: 0, b: 5, weight: 0.30}       # highest max temperature minus the threshold, deg C
    H3: {a: 1, b: 5, weight: 0.20}       # mean max temperature next 16 days minus its 20-year normal, deg C

# Crop stage tables in days after sowing (BUILD_SPEC §7). `sensitive: true` marks stages the spec stars.
# heat_c: max-temperature thresholds for sensitive stages / other stages. With no sowing date the stage is
# unknown and the "other" threshold is used. Crop "unknown" ("Not sure") uses `unknown_crop_heat_c`.
unknown_crop_heat_c: 35
crops:
  wheat:
    label: Wheat
    heat_c: {sensitive: 32, other: 34}
    stages:
      - {key: emergence, label: Emergence, start: 0, end: 20, sensitive: false}
      - {key: crown_root_initiation, label: Crown-root initiation (key irrigation), start: 21, end: 25, sensitive: true}
      - {key: tillering, label: Tillering, start: 26, end: 45, sensitive: false}
      - {key: jointing_booting, label: Jointing / booting, start: 46, end: 70, sensitive: false}
      - {key: heading_flowering, label: Heading / flowering, start: 71, end: 95, sensitive: true}
      - {key: grain_filling, label: Grain filling, start: 96, end: 120, sensitive: true}
      - {key: maturity_harvest, label: Maturity / harvest, start: 121, end: null, sensitive: true}
  mustard:
    label: Mustard
    heat_c: {sensitive: 30, other: 33}
    stages:
      - {key: emergence, label: Emergence, start: 0, end: 15, sensitive: false}
      - {key: vegetative, label: Vegetative, start: 16, end: 35, sensitive: false}
      - {key: flowering, label: Flowering, start: 36, end: 60, sensitive: true}
      - {key: pod_filling, label: Pod filling, start: 61, end: 100, sensitive: true}
      - {key: maturity_harvest, label: Maturity / harvest, start: 101, end: null, sensitive: true}
  gram:
    label: Gram (chickpea)
    heat_c: {sensitive: 32, other: 35}
    stages:
      - {key: emergence, label: Emergence, start: 0, end: 20, sensitive: false}
      - {key: branching, label: Branching, start: 21, end: 45, sensitive: false}
      - {key: flowering, label: Flowering, start: 46, end: 75, sensitive: true}
      - {key: pod_filling, label: Pod filling, start: 76, end: 105, sensitive: true}
      - {key: maturity_harvest, label: Maturity / harvest, start: 106, end: null, sensitive: true}

# Colour bins for the radar change overlay (VH dB, now minus last year). Same colours as the NDVI change ramp;
# +/-1 dB is treated as "no change" because single-date Sentinel-1 speckle is about that size.
radar_change_bins_db: [-3.0, -1.0, 1.0, 3.0]
