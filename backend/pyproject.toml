[project]
name = "khetkavach-backend"
version = "1.0.0"
description = "KhetKavach: farm-level climate risk agent (FastAPI + LangGraph + Sentinel + Open-Meteo + Sarvam)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "sse-starlette>=3.6,<3.7",
    "langgraph>=1.2,<1.3",
    "google-genai>=2.34,<2.35",
    "httpx>=0.28,<0.29",
    "pystac-client>=0.9,<0.10",
    "planetary-computer>=1.0,<1.1",
    "odc-stac>=0.5.3,<0.6",
    "rioxarray>=0.19,<0.20",
    "rasterio>=1.4.4,<1.5",
    "numpy>=2.4,<2.5",
    "Pillow>=13.0,<13.1",
    "pydantic>=2.14,<2.15",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.2,<1.3",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<9.3", "pytest-asyncio>=1.4,<1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls the real external APIs (run before deploy: pytest -m live)",
]
addopts = "-m 'not live'"
